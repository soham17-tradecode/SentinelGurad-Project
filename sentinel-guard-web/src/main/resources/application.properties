spring.application.name=sentinel-guard-web
server.port=8085
# API Gateway entry point used by the server-side Thymeleaf login flow
sentinel.auth.base-url=${SENTINEL_GATEWAY_URL:http://localhost:8080}

# Keep the browser session cookie inaccessible to JavaScript
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.level.org.springframework.security=DEBUG